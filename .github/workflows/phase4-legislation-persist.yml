name: Phase 4 — Legislation persist + audit (DEV, manual)

# Manually-triggered, DEV-only. Runs the full-corpus hybrid reprocess and then
# PERSISTS the machine-derived page-extraction layer to the DEV database, followed
# by a read-only post-persistence audit. This is the one job where the full-corpus
# extraction data and the DEV credentials co-exist, so persistence is faithful.
#
# Safety:
#   - published stays FALSE (DB CHECK + code); publishing is a separate later phase.
#   - raw/normalized extraction is never overwritten (additive structured layer only).
#   - persist is idempotent (ON CONFLICT on the unique page/build key).
#   - the persist step requires confirm=DEV AND run_persist=true; a plain run writes nothing.
#   - credentials come only from environment SECRETS; nothing is echoed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEV to confirm this runs against the DEV project only'
        required: true
        default: ''
      cohort_size:
        description: 'Reprocess cohort size: a number, or ALL for the full eligible corpus'
        required: false
        default: 'ALL'
      run_persist:
        description: 'Persist the extraction layer to DEV (writes rows; published stays false)'
        type: boolean
        default: false

concurrency:
  group: phase4-legislation-persist
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # keyless Google auth (OIDC) for live Path-B2 OCR

jobs:
  persist:
    runs-on: ubuntu-latest
    environment: dev
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      GCP_DOCAI_PROCESSOR: ${{ vars.GCP_DOCAI_PROCESSOR }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_PROVIDER: google-docai
    steps:
      - name: Guard — DEV confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEV" ]; then
            echo "Refusing: type DEV in the 'confirm' input to run (DEV-only)."; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System deps (poppler + pdftk for page split)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils pdftk-java

      - name: Install dependencies
        run: |
          npm ci
          npm i --no-save @google-cloud/documentai

      - name: Authenticate to Google Cloud (OIDC / Workload Identity — keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Resolve inventory + fetch corpus from Object Storage
        env:
          COHORT_SIZE: ${{ github.event.inputs.cohort_size }}
          B2_IDS: ''
        run: |
          node --experimental-strip-types tools/legal-ingest/fetch-cohort-from-storage.ts
          echo "=== corpus inventory ==="; cat tools/legal-ingest/.corpus-inventory.json || true

      - name: Hybrid reprocess (A/B1 local + live B2 Google OCR) → staging extraction records
        run: |
          PDFS_DIR=tools/legal-ingest/.cohort-pdfs \
          WORKLIST=tools/legal-ingest/.cohort-worklist.json \
          node --experimental-strip-types tools/legal-ingest/reprocess-hybrid.ts

      - name: Persist plan (dry-run — always runs, writes no DB)
        run: node --experimental-strip-types tools/legal-ingest/persist-page-extraction.ts

      - name: Persist extraction layer to DEV (gated on run_persist=true)
        if: ${{ github.event.inputs.run_persist == 'true' }}
        run: node --experimental-strip-types tools/legal-ingest/persist-page-extraction.ts --commit

      - name: Post-persistence audit (read-only)
        if: ${{ github.event.inputs.run_persist == 'true' }}
        run: node --experimental-strip-types tools/legal-ingest/audit-page-extraction.ts

      - name: Collect JSON artifacts (no PDFs, no secrets)
        run: |
          mkdir -p _artifacts
          for f in _reprocess-metrics.json _corpus-inventory.json _persist-plan.json _persist-audit.json; do
            cp -f "tools/legal-ingest/.staging-hybrid/$f" _artifacts/ 2>/dev/null || \
            cp -f "tools/legal-ingest/$f" _artifacts/ 2>/dev/null || true
          done
          echo "artifacts:"; find _artifacts -type f -name '*.json' | sort

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: phase4-persist-json
          path: _artifacts/**/*.json
          if-no-files-found: warn
